<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640">
  <style>
    .box{fill:#fff;stroke:#000;stroke-width:2}
    .zone{fill:none;stroke:#000;stroke-width:2;stroke-dasharray:8 8}
    .t16{font:16px Arial, Helvetica, sans-serif}
    .line{stroke:#000;stroke-width:2}
  </style>

  <!-- Зоны -->
  <rect x="40" y="40" width="1120" height="220" class="zone"/>
  <text x="52" y="62" class="t16">Высоковольтная зона (HV)</text>
  <rect x="40" y="340" width="1120" height="240" class="zone"/>
  <text x="52" y="362" class="t16">Низковольтная зона (LV)</text>

  <!-- HV: по колонкам -->
  <rect x="80"  y="120" width="220" height="80" class="box"/>
  <text x="95" y="150" class="t16">AC IN 220–240 V</text>
  <text x="95" y="172" class="t16">L / N</text>

  <rect x="340" y="120" width="220" height="80" class="box"/>
  <text x="352" y="150" class="t16">F1 32 A gG (10×38)</text>
  <text x="352" y="172" class="t16">MOV 275 VAC (L–N)</text>

  <rect x="600" y="120" width="220" height="80" class="box"/>
  <text x="612" y="150" class="t16">SSR 40 A (zero-cross)</text>
  <text x="612" y="172" class="t16">разрыв L</text>

  <rect x="860" y="120" width="220" height="80" class="box"/>
  <text x="905" y="166" class="t16">Нагрузка</text>

  <!-- HV соединения L -->
  <line x1="300" y1="160" x2="340" y2="160" class="line"/>
  <line x1="560" y1="160" x2="600" y2="160" class="line"/>
  <line x1="820" y1="160" x2="860" y2="160" class="line"/>

  <!-- N напрямую -->
  <line x1="190" y1="205" x2="970" y2="205" class="line"/>

  <!-- LV: по колонкам -->
  <rect x="80"  y="420" width="220" height="80" class="box"/>
  <text x="95" y="450" class="t16">Изолированный AC-DC</text>
  <text x="95" y="472" class="t16">5 В ≥ 2 А</text>

  <rect x="340" y="400" width="220" height="120" class="box"/>
  <text x="355" y="436" class="t16">ESP32-WROOM-32</text>
  <text x="355" y="458" class="t16">Wi-Fi + HTTP API</text>
  <text x="355" y="480" class="t16">3.3 В от LDO</text>

  <rect x="600" y="420" width="220" height="80" class="box"/>
  <text x="615" y="450" class="t16">Драйвер NPN + R</text>
  <text x="615" y="472" class="t16">GPIO → SSR IN</text>

  <!-- Соединения LV -->
  <line x1="300" y1="460" x2="340" y2="460" class="line"/>
  <line x1="560" y1="460" x2="600" y2="460" class="line"/>

  <!-- Управление SSR (вертикаль по центру колонны SSR/драйвер) -->
  <line x1="710" y1="420" x2="710" y2="200" class="line"/>

  <!-- Подвод питания к PS1 от HV -->
  <line x1="190" y1="260" x2="190" y2="420" class="line"/>
</svg>